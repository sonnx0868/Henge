format_version: '13'
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: ios

meta:
  bitrise.io:
    stack: osx-xcode-latest-stable

workflows:
  check_scroll:
    steps:
      - git-clone@8: {}
      - script@1:
          title: Check wheel transport and Mac helper
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -euo pipefail
                make build/test_scroll_bridge build/test_scroll_pixels build/henge-agent
                swiftc -parse-as-library ios/Henge/ScrollMotion.swift tests/test_scroll_motion.swift -o build/test_scroll_motion
                swiftc -frontend -parse ios/Henge/Hardware.swift ios/Henge/MouseScrollSettings.swift ios/Henge/SessionView.swift
                build/test_scroll_bridge
                build/test_scroll_pixels
                build/test_scroll_motion
  build_ipa:
    triggers:
      push:
        - branch: codex/fix-ipad-color
    steps:
      - git-clone@8: {}
      - script@1:
          title: Build Henge IPA
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -euo pipefail
                bash ci/build-bitrise.sh
      - deploy-to-bitrise-io@2:
          inputs:
            - is_enable_public_page: 'false'
